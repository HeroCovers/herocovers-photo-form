<!DOCTYPE html>
<html>
<head>
  <title>HeroCovers Photo Upload</title>
  <style>
    body { font-family: Arial; background:#f4f4f4; padding:20px; }
    .box { max-width:650px; background:#fff; padding:20px; margin:auto; border-radius:12px; }
    h2 { text-align:center; }
    img { width:100%; border-radius:8px; margin:10px 0; }
    input, button { width:100%; padding:10px; margin:10px 0; }
    button { background:#ff6b4a; color:white; border:none; font-size:16px; cursor:pointer; }
  </style>
</head>
<body>

<div class="box">
  <h2>HeroCovers Photo Upload</h2>
  <p>Please upload photos using the same angles shown below.</p>

  <input type="text" id="name" placeholder="Your Name" required>

  <p><b>Front View</b></p>
  <img src="front.jpg">
  <input type="file" id="front">
  <input type="file" id="front1">
  <input type="file" id="front2">

  <p><b>Side View</b></p>
  <img src="side.jpg">
  <input type="file" id="side">
  <input type="file" id="side1">
  <input type="file" id="side2">
  <input type="file" id="side3">
  <input type="file" id="side4">
  <input type="file" id="side5">

  <p><b>Rear View</b></p>
  <img src="rear.jpg">
  <input type="file" id="rear">
  <input type="file" id="rear1">
  <input type="file" id="rear2">

  <p><b>Front Wheel</b></p>
  <img src="front-wheel.jpg">
  <input type="file" id="frontwheel">
  <input type="file" id="frontwheel1">
  <input type="file" id="frontwheel2">
  <input type="file" id="frontwheel3">

  <p><b>Rear Wheel</b></p>
  <img src="rear-wheel.jpg">
  <input type="file" id="rearwheel">
  <input type="file" id="rearwheel1">
  <input type="file" id="rearwheel2">
  <input type="file" id="rearwheel3">

  <p><b>Headlights</b></p>
  <img src="headlights.jpg">
  <input type="file" id="headlights">
  <input type="file" id="headlights1">
  <input type="file" id="headlights2">
  <input type="file" id="headlights3">

  <p><b>Taillights</b></p>
  <img src="taillights.jpg">
  <input type="file" id="taillights">
  <input type="file" id="taillights1">
  <input type="file" id="taillights2">
  <input type="file" id="taillights3">

  <p><b>Exhaust</b></p>
  <img src="exhaust.jpg">
  <input type="file" id="exhaust">
  <input type="file" id="exhaust1">
  <input type="file" id="exhaust2">

  <button onclick="submitForm()">Submit Photos</button>
</div>

<script>
function hasAtLeastOne(ids){
  return ids.some(id => {
    const el = document.getElementById(id);
    return el && el.files.length > 0;
  });
}

function submitForm(){
  const name = document.getElementById("name").value.trim();
  if(!name){
    alert("Please enter your name.");
    return;
  }

  const groups = {
    "Front view": ["front","front1","front2"],
    "Side view": ["side","side1","side2","side3","side4","side5"],
    "Rear view": ["rear","rear1","rear2"],
    "Front wheel": ["frontwheel","frontwheel1","frontwheel2","frontwheel3"],
    "Rear wheel": ["rearwheel","rearwheel1","rearwheel1","rearwheel3"],
    "Headlights": ["headlights","headlights1","headlights2","headlights3"],
    "Taillights": ["taillights","taillights1","taillights2","taillights3"],
    "Exhaust": ["exhaust","exhaust1","exhaust2"]
  };

  for(const label in groups){
    if(!hasAtLeastOne(groups[label])){
      alert("Please upload at least one photo for: " + label);
      return;
    }
  }

  const formData = new FormData();
  formData.append("name", name);

  Object.values(groups).flat().forEach(id=>{
    const el = document.getElementById(id);
    if(el && el.files.length > 0){
      formData.append(id, el.files[0]);
    }
  });

  fetch("https://primary-production-43b16.up.railway.app/webhook/b22c718b-8b84-4c38-9274-a507de4bcaec", {
    method: "POST",
    body: formData
  })
  .then(res=>{
    if(res.ok){
      alert("Upload successful! Thank you.");
    } else {
      alert("Upload failed. Please try again.");
    }
  })
  .catch(()=>{
    alert("Network error. Please try again.");
  });
}
</script>

</body>
</html>
